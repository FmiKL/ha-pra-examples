name: multi-provider-failover

x-app: &app
  build: ../../app
  healthcheck:
    test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health') === false ? 1 : 0);"]
    interval: 5s
    timeout: 5s
    retries: 10
  depends_on:
    scaleway-db:
      condition: service_healthy
    ovh-db:
      condition: service_healthy

x-db: &db
  image: mysql:8.4
  environment:
    MYSQL_DATABASE: app
    MYSQL_USER: app
    MYSQL_PASSWORD: local-demo-password
    MYSQL_ROOT_PASSWORD: local-root-password
  healthcheck:
    test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1'"]
    interval: 3s
    timeout: 5s
    retries: 30
    start_period: 20s

services:
  cloudflare:
    image: haproxy:3.2-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  scaleway-app:
    <<: *app
    ports:
      - "127.0.0.1:${SCALEWAY_PORT:-8081}:80"
    environment:
      APP_ENV: scaleway
      # Base active, enregistrée dans .env par la bascule de la base.
      DB_HOST: ${ACTIVE_DATABASE:-scaleway-db}
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: local-demo-password

  scaleway-db:
    <<: *db
    volumes:
      - scaleway-mysql:/var/lib/mysql
      - ../../app/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  ovh-app:
    <<: *app
    ports:
      - "127.0.0.1:${OVH_PORT:-8082}:80"
    environment:
      APP_ENV: ovh
      DB_HOST: ${ACTIVE_DATABASE:-scaleway-db}
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: local-demo-password

  ovh-db:
    <<: *db
    volumes:
      - ovh-mysql:/var/lib/mysql
      - ../../app/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  scaleway-mysql:
  ovh-mysql:
