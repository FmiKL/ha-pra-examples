global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 1s
    timeout client 30s
    timeout server 30s

# Suivre les changements d'adresse des origines.
resolvers docker
    nameserver dns 127.0.0.11:53

frontend http
    bind :80
    default_backend origins

backend origins
    option httpchk GET /health
    http-check expect status 200
    server scaleway scaleway-app:80 check resolvers docker init-addr none
    # Origine de repli, utilisée seulement quand Scaleway échoue au contrôle de santé.
    server ovh ovh-app:80 check backup resolvers docker init-addr none
