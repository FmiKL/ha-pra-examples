global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 1s
    timeout client 30s
    timeout server 30s

# Suivre le déplacement de l'IP flottante.
resolvers docker
    nameserver dns 127.0.0.11:53

frontend http
    bind :80
    default_backend vip

backend vip
    server vip vip:80 resolvers docker init-addr none
