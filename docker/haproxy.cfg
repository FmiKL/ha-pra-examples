global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 1s
    timeout client 30s
    timeout server 30s
    # Rejouer sur l'autre instance une connexion échouée.
    retries 1
    option redispatch

# Suivre les changements d'adresse des instances Docker.
resolvers docker
    nameserver dns 127.0.0.11:53

frontend http
    bind :80
    default_backend app

backend app
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server-template app 2 scaleway-app:80 check resolvers docker init-addr none
