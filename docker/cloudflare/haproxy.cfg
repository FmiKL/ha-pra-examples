global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 1s
    timeout client 30s
    timeout server 30s

# Démarrer même si une origine n'existe pas encore, puis suivre son adresse.
resolvers docker
    nameserver dns 127.0.0.11:53

frontend http
    bind :80
    use_backend %[str(active),map(/usr/local/etc/haproxy/routing/origin.map)]

backend ovh
    server origin ovh:80 resolvers docker init-addr none

backend scaleway
    server origin scaleway:80 resolvers docker init-addr none
